[package]
name = "aegis"
version = "0.1.0"
edition = "2024"
description = "Information-flow firewall for AI agent tool calls (MCP proxy with taint tracking)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rasmsnall/aegis"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
