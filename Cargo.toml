[package]
name = "mcp-aegis"
version = "0.1.0"
edition = "2024"
description = "Information-flow firewall for AI agent tool calls (MCP proxy with taint tracking)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rasmsnall/aegis"
readme = "README.md"
keywords = ["mcp", "agents", "security", "prompt-injection", "llm"]
categories = ["command-line-utilities", "development-tools", "network-programming"]
exclude = [".github/"]

# The package is published as `mcp-aegis` (the `aegis` name on crates.io is an
# unrelated crate); the library and command are still called `aegis`.
[lib]
name = "aegis"
path = "src/lib.rs"

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
