[package]
name = "mcp-aegis"
version = "0.4.0"
edition = "2024"
description = "Information-flow firewall for AI agent tool calls (MCP proxy with taint tracking)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rasmsnall/aegis"
readme = "README.md"
keywords = ["mcp", "agents", "security", "prompt-injection", "llm"]
categories = ["command-line-utilities", "development-tools", "network-programming"]
exclude = [".github/", "action.yml", "docs/", "install.sh", "site/"]

# The package is published as `mcp-aegis` (the `aegis` name on crates.io is an
# unrelated crate); the library and command are still called `aegis`.
[lib]
name = "aegis"
path = "src/lib.rs"
# cdylib: the policy engine also builds to WebAssembly for the website's
# playground (`--target wasm32-unknown-unknown --no-default-features`).
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "aegis"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
# Everything beyond the pure policy engine: the proxy, audit log and CLI.
runtime = ["dep:anyhow", "dep:clap", "dep:hex", "dep:hmac", "dep:libc", "dep:reqwest", "dep:rustls", "dep:sha2", "dep:tokio", "dep:toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider", "system-proxy"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"], optional = true }
toml = { version = "0.8", optional = true }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock system calls for `[server.sandbox]`.
libc = { version = "0.2", optional = true }

[profile.release]
# Keeps the WebAssembly build small.
opt-level = "s"
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
