name: Release

# On a version tag (e.g. v0.1.0): checks the tag matches Cargo.toml, runs the
# tests, publishes the crate to crates.io, and creates a GitHub release with
# that version's section of CHANGELOG.md.
# Requires a CARGO_REGISTRY_TOKEN repository secret.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Check the secret is set
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Add a CARGO_REGISTRY_TOKEN repository secret first."; exit 1; }
      - run: cargo test
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="## $version" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          printf '\nInstall with `cargo install mcp-aegis`.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "aegis $GITHUB_REF_NAME" --notes-file notes.md
