name: Release

# Publishes the version in Cargo.toml: runs the tests, publishes the crate to
# crates.io, and creates a GitHub release (and its v<version> tag) with that
# version's section of CHANGELOG.md, then attaches prebuilt binaries to it
# (which install.sh downloads).
#
# Start it by pushing a tag matching Cargo.toml (git push origin v0.1.0), or
# from the Actions tab ("Run workflow" on main), which creates the tag for you.
# Requires a CARGO_REGISTRY_TOKEN repository secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Work out the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$tag" || { echo "tag $GITHUB_REF_NAME != $tag in Cargo.toml"; exit 1; }
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; bump the version in Cargo.toml first."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check the secret is set
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Add a CARGO_REGISTRY_TOKEN repository secret first."; exit 1; }
      - run: cargo test
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          Install a prebuilt binary (Linux, macOS):

              curl -fsSL https://raw.githubusercontent.com/rasmsnall/aegis/main/install.sh | sh

          or build it with `cargo install mcp-aegis`. Windows binaries are attached below.
          EOF
          # Creates the tag at this commit if it doesn't exist yet.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "aegis $TAG" --notes-file notes.md

  binaries:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --bin aegis --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="aegis-$TARGET"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/aegis.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            cp "target/$TARGET/release/aegis" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
