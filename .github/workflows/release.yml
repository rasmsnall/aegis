name: Release

# Publishes the version in Cargo.toml: runs the tests, publishes the crate to
# crates.io, and creates a GitHub release (and its v<version> tag) with that
# version's section of CHANGELOG.md.
#
# Start it by pushing a tag matching Cargo.toml (git push origin v0.1.0), or
# from the Actions tab ("Run workflow" on main), which creates the tag for you.
# Requires a CARGO_REGISTRY_TOKEN repository secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Work out the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$tag" || { echo "tag $GITHUB_REF_NAME != $tag in Cargo.toml"; exit 1; }
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; bump the version in Cargo.toml first."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check the secret is set
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Add a CARGO_REGISTRY_TOKEN repository secret first."; exit 1; }
      - run: cargo test
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          printf '\nInstall with `cargo install mcp-aegis`.\n' >> notes.md
          # Creates the tag at this commit if it doesn't exist yet.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "aegis $TAG" --notes-file notes.md
