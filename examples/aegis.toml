# Example aegis configuration.
#
# Point your agent at `aegis run --config aegis.toml` instead of at the MCP
# servers directly. Tools are exposed as <server>__<tool>, e.g. shell__exec.

[audit]
path = "aegis-audit.jsonl"
# Sign the log so it cannot be rewritten without this key. Keep the file out
# of reach of the servers below (another user, or outside their sandbox), or
# set AEGIS_AUDIT_KEY instead; aegis never passes that variable on to servers.
# key_file = "/etc/aegis/audit.key"
# Tool arguments are logged with secrets (tokens, passwords, API keys,
# credential-looking values) replaced by "[redacted]". Other modes: "full",
# "hash" (only a SHA-256), "omit".
arguments = "redacted"
# redact_keys = ["customer_id"]   # extra argument names to redact

[policy]
# What happens to a tool call no rule matches.
default = "allow"
# Labels for output of tools no [[source]] below matches. Unlisted tools are
# untrusted, so a new or renamed tool is never trusted by accident.
default_labels = ["untrusted"]

# --- Upstream MCP servers (stdio) ----------------------------------------

[[server]]
name = "web"
command = "uvx"
args = ["mcp-server-fetch"]

[[server]]
name = "github"
command = "github-mcp-server"
args = ["stdio"]
env = { GITHUB_TOOLSETS = "repos,issues,pull_requests" }

[[server]]
name = "shell"
command = "my-shell-mcp-server"
# A request that takes longer than this fails instead of hanging the agent.
call_timeout_secs = 120

# --- Sources: labels attached to tool output ------------------------------
# Once a session has seen output with a label, the label stays for the rest
# of the session.

# Sources are checked in order; the first that matches decides. Pages from
# these hosts are trusted, so reading documentation doesn't block anything.
[[source]]
tool = "web__fetch"
labels = []
hosts = ["docs.rs", "*.rust-lang.org"]

[[source]]
tool = "web__*"
labels = ["untrusted", "external"]

# Code and metadata from our own repositories are trusted (labels = []).
[[source]]
tool = "github__get_file_contents"
labels = []

# Issue and PR text is written by anyone who can open one.
[[source]]
tool = "github__get_issue*"
labels = ["untrusted"]

[[source]]
tool = "github__*pull_request*"
labels = ["untrusted"]

# --- Rules: checked in order, first match decides ------------------------

[[rule]]
tool = "shell__*"
when_context_has = ["untrusted"]
action = "deny"
reason = "shell commands are disabled once untrusted content is in context"

# "ask" shows the person using the agent an approval prompt (through the MCP
# client's elicitation support). The model cannot see or answer it. With no
# answer within [approval].timeout_secs, or a client that can't ask, the call
# is denied.
[[rule]]
tool = "github__push_files"
when_context_has = ["untrusted"]
action = "ask"
reason = "pushing after reading untrusted content needs a person's OK"

[[rule]]
tool = "github__create_or_update_file"
when_context_has = ["untrusted"]
action = "deny"
reason = "writing files is disabled once untrusted content is in context"

[[rule]]
tool = "github__delete_*"
action = "deny"
reason = "deletion is never allowed through this agent"

[approval]
timeout_secs = 300

# --- Labels that outlive a session ---------------------------------------
# A session holding untrusted data could write it into a file that a later,
# clean session reads through a trusted tool. For tools listed here, a write
# made while the session holds labels stores them against the file (in
# [state].path), and any later read of that file brings them back.

[[resource]]
write = "github__create_or_update_file"
read = "github__get_file_contents"
key = "path"

[state]
path = "aegis-state.json"

[limits]
# Largest single message accepted from the agent or a server. A server that
# exceeds it is disconnected; an oversized agent message gets an error.
max_message_bytes = 16777216
